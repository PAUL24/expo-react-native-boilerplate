name: Feature request
description: Propose a broadly reusable boilerplate improvement
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which recurring application-development problem should the boilerplate solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, architecture, dependency cost, and alternatives considered.
    validations:
      required: true
